<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>器材調度板</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="器材調度">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: native-style phone app — translucent top nav, large titles, grouped lists; pushed detail screens hide the tab bar and pin one primary action to the bottom. Look: road-case aluminum + gaffer-tape labels; phase colors = 抓貨 orange, 演出中 blue, 歸還 green. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#15181B; --muted:#5F6770; --line:#D9DDE2;
  --accent:#C9701E; --accent-ink:#FFFFFF; --accent-soft:#F6E3CF;
  --show:#2C6AAE; --show-soft:#DCE7F4;
  --tape:#F2EDE0; --tape-ink:#1C1A16; --tape-edge:#DCD4BF;
  --ok:#2E8457; --ok-soft:#DAEFE2; --bad:#C23B2A; --bad-soft:#F8DED9; --warn:#9C6410; --warn-soft:#F7E8CC;
  --glass:rgba(248,249,250,.88); --scrim:rgba(10,12,14,.48); --on-strong:#FFFFFF;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 6px 18px rgba(20,24,28,.07);
  --f-display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#1A1D20; --surface2:#23272B; --ink:#ECEEF0; --muted:#9AA2AB; --line:#2D3237;
  --accent:#E8913E; --accent-ink:#1A1206; --accent-soft:#3A2814;
  --show:#6EA8E6; --show-soft:#152638;
  --tape:#E6DFCC; --tape-ink:#1C1A16; --tape-edge:#C9C0A8;
  --ok:#55B983; --ok-soft:#163124; --bad:#F06A57; --bad-soft:#3D1D18; --warn:#E3AA45; --warn-soft:#3A2B10;
  --glass:rgba(22,24,27,.88); --scrim:rgba(0,0,0,.6); --on-strong:#0F1113;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#1A1D20; --surface2:#23272B; --ink:#ECEEF0; --muted:#9AA2AB; --line:#2D3237;
  --accent:#E8913E; --accent-ink:#1A1206; --accent-soft:#3A2814;
  --show:#6EA8E6; --show-soft:#152638;
  --tape:#E6DFCC; --tape-ink:#1C1A16; --tape-edge:#C9C0A8;
  --ok:#55B983; --ok-soft:#163124; --bad:#F06A57; --bad-soft:#3D1D18; --warn:#E3AA45; --warn-soft:#3A2B10;
  --glass:rgba(22,24,27,.88); --scrim:rgba(0,0,0,.6); --on-strong:#0F1113;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.topnav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(48px + env(safe-area-inset-top,0px));box-sizing:border-box;border-bottom:1px solid transparent;transition:background .15s,border-color .15s}
.topnav.show{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.topnav .tt{font-weight:700;font-size:16px;opacity:0;transition:opacity .15s;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.topnav.show .tt{opacity:1}
.navback{justify-self:start;border:0;background:transparent;color:var(--accent);font-size:16px;display:flex;align-items:center;gap:0;padding:6px 4px 6px 0}
.navmore{justify-self:end;border:0;background:transparent;color:var(--accent);width:40px;height:40px;display:grid;place-items:center}

main{padding-block:52px calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto}
.screen-in{animation:pushin .24s ease-out}
@keyframes pushin{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.screen-in,.sheet{animation:none!important}}

.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.lt h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.05;letter-spacing:.01em}
.lt p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.me{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);object-fit:cover;flex:none}
.banner{border:1px dashed var(--warn);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13.5px}

.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;min-height:28px}
.sech h2{margin:0;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent);font-weight:500;font-size:14px;padding:4px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box;background:transparent;text-align:left;min-height:54px}
.row:last-child{border-bottom:0}
button.row:active,label.row:active{background:var(--surface2)}
.rn{flex:1;min-width:0;overflow-wrap:anywhere}
.rn small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:1px}
.rq{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.rq small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.chev{color:var(--muted);width:18px;height:18px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 18px;color:var(--muted);text-align:center;font-size:14px;background:var(--surface);line-height:1.6}

.stub{flex:none;width:50px;display:flex;flex-direction:column;align-items:center;padding-right:12px;border-right:1px dashed var(--line)}
.stub b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stub small{font-size:11px;color:var(--muted);white-space:nowrap}
.evname{display:block;font-weight:700;font-size:16px;line-height:1.35}
.evsub{display:block;font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border-radius:999px;padding:1px 8px;white-space:nowrap}
.badge.pick{background:var(--accent-soft);color:var(--accent)}
.badge.show{background:var(--show-soft);color:var(--show)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.mute{background:var(--surface2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip small{opacity:.7;margin-left:3px}
.prow-add .plus{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700}
.prow-add[disabled]{opacity:.45}
.tplcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:14px 14px;margin-top:12px}
.tplcard b{color:var(--accent)}
.typetag{align-self:flex-start;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}

/* detail */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.tape{align-self:flex-start;max-width:100%;background:var(--tape);color:var(--tape-ink);border:1px solid var(--tape-edge);padding:2px 12px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;transform:rotate(-1.2deg);clip-path:polygon(2% 0,98% 4%,100% 50%,98% 100%,1% 96%,0 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname{margin:2px 0 0;font-size:28px;line-height:1.25;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.hdate{margin:0;font-size:18px;color:var(--muted)}
.hnote{margin:2px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.steps li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);position:relative;z-index:1}
.steps li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:-1}
.steps li:first-child::before{display:none}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:15px}
.steps li.past .dot{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.steps li.past::before,.steps li.cur::before{background:var(--ok)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur.p-pick .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.cur.p-show .dot{background:var(--show);border-color:var(--show);color:var(--on-strong)}
.steps li.cur.p-done .dot{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink);padding:0}
.quick .ic{width:50px;height:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);box-shadow:var(--shadow)}
.alert{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;font-weight:500}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.progress .top{display:flex;justify-content:space-between;align-items:baseline}
.progress .top b{font-family:var(--f-display);font-size:26px;line-height:1}
.progress .top span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.bar.full i{background:var(--ok)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg .cnt{background:var(--muted);color:var(--surface);border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.seg button[aria-pressed="true"] .cnt{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface2);flex:none}
.stepper button{border:0;background:transparent;width:36px;height:36px;font-size:20px;line-height:1;color:var(--accent)}
.stepper button:disabled{color:var(--muted);opacity:.35}
.stepper input{width:40px;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:700;padding:0}
.row.zero .rn{text-decoration:line-through;color:var(--muted)}
.cap{color:var(--muted)} .cap.low{color:var(--bad);font-weight:500}
.addrow{display:flex;gap:8px;padding:10px 12px;background:var(--surface2)}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}

.chk{position:relative;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);transition:background .12s,border-color .12s}
.box svg{width:17px;height:17px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.chk input:checked + .box{background:var(--accent);border-color:var(--accent)}
.chk input:checked + .box svg{opacity:1}
.chk input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.pickrow .pickbox{display:flex;align-items:center;padding:0 0 0 14px;align-self:stretch}
.pickrow .row{flex:1;min-width:0;border-bottom:0}
.pickrow.picked .rn > span:first-child{color:var(--muted);text-decoration:line-through}
.pickrow.picked .rq{color:var(--muted)}
.chipline{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:5px}
.mphead{font-size:22px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.rem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;cursor:pointer}
.rem input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.tag.map{white-space:normal;flex:1 1 100%;order:5}
.row.chosen{background:var(--accent-soft)}
.prow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .row{border-bottom:0;flex:1;min-width:0}
.prow.sel{background:var(--accent-soft)}
.mini{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 14px;flex:none}
.mini.armed{color:var(--bad);font-weight:700}
.done .rn{color:var(--muted)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.ghead button{border:0;background:transparent;padding:0;font-weight:700;font-size:16px;text-align:left;color:var(--ink);overflow-wrap:anywhere;min-width:0}
.ghead span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.loglist .row{min-height:0;padding:9px 14px;font-size:13.5px}

.rep{align-items:flex-start}
.rep img,.rep .noimg{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.rt{display:block;font-weight:700}
.ri{display:-webkit-box;font-size:13.5px;line-height:1.45;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;color:var(--ink)}
.search input:focus{outline:none}
.stock{text-align:right;flex:none}
.stock b{font-family:var(--f-display);font-size:24px;line-height:1}
.stock b.low{color:var(--bad)}
.stock small{display:block;font-size:11.5px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transition:transform .2s}
body.pushed nav.tabs{transform:translateY(110%)}
nav.tabs button{flex:1;border:0;background:transparent;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);position:relative}
nav.tabs svg.i{width:25px;height:25px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tb{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-strong);font-size:11px;font-weight:700;line-height:18px;text-align:center;padding:0 5px;box-sizing:border-box}
.fab{position:fixed;z-index:24;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;border-radius:20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px rgba(0,0,0,.24);display:grid;place-items:center}
.fab svg.i{width:28px;height:28px;stroke-width:2.2}
.cbar{position:fixed;z-index:26;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.pushed .cbar{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.cbar > div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.cbar .pill{background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
body.pushed .cbar .pill{box-shadow:none}
.cbar span{flex:1;font-size:14px}
.cta{flex:1;border:0;border-radius:14px;padding:15px;font-size:16.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.cta.p-pick{background:var(--accent);color:var(--accent-ink)}
.cta.p-show{background:var(--show);color:var(--on-strong)}
.cta.armed{background:var(--bad);color:var(--on-strong)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.cbar .pill .btn.ghost{color:var(--bg);border-color:transparent}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:7px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding-block:6px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head button{border:0;background:transparent;font-size:15px;padding:6px 0;text-align:left}
.sheet-head .save{color:var(--accent);font-weight:700;text-align:right}

<body>

<div class="topnav pad" id="topnav"><button class="navback" id="navBack" type="button" hidden></button><div class="tt" id="navTitle"></div><button class="navmore" id="navMore" type="button" aria-label="更多動作" hidden></button></div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const CATS=["喇叭","擴大機","混音台","無線","耳返","麥克風","樂器","架類","燈光","線材","雜項","其他"];
/* 活動性質不寫在程式裡，來自自己匯入的資料和用過的性質 */
const evTypes=()=>{const o=[...(S.templates.get("__types")?.list||[])];for(const k of S.templates.keys())if(k!=="__types"&&!o.includes(k))o.push(k);for(const e of S.events.values())if(e.type&&!o.includes(e.type))o.push(e.type);return o};
const UNITS=["支","顆","台","箱","片","套","組","個","條","捲","只","隻","把","座","件","對","櫃","包"];
const WD=["日","一","二","三","四","五","六"];
const TABS=[["events","活動"],["pending","待補"],["repairs","維修"],["gear","庫存"]];
const TN=Object.fromEntries(TABS);
const PH={pick:["抓貨","pick"],show:["演出中","show"],done:["已歸還","ok"]};
const IC={
  cal:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  clip:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M8.5 12.5l2.3 2.3 4.7-4.8"/></svg>',
  wrench:'<svg class="i" viewBox="0 0 24 24"><path d="M13.7 6.3a4 4 0 0 0 5 5L20 13l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 1-5-5L12 2.5l1.7 3.8z"/><path d="M4 20l5-5"/></svg>',
  box:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2M3 12h18M10 12v3h4v-3"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  imp:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  img:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>',
  swap:'<svg class="i" viewBox="0 0 24 24"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>',
  undo:'<svg class="i" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg>',
  info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  truck:'<svg class="i" viewBox="0 0 24 24"><path d="M2.5 6h11v10h-11zM13.5 9.5h4l3.5 3.5v3h-7.5"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  home:'<svg class="i" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h12V9.5"/></svg>',
  more:'<svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></svg>',
  chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
};

let evTab="pick";try{evTab=localStorage.getItem("evTab")||"pick"}catch(_){}
let gTab="hw";try{gTab=localStorage.getItem("gTab")||"hw"}catch(_){}
const inGTab=g=>((g.category||"其他")==="線材")===(gTab==="cable");
const S={gear:new Map(),events:new Map(),repairs:new Map(),templates:new Map(),tab:"events",detail:null,repTab:"open",gq:"",sel:new Set(),canWrite:true,dbOk:null,me:null,meAvatar:null,loaded:{g:0,e:0,r:0},scroll:{}};
let db=null,user=null,sample=null,imagesOk=false,assets=null;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
/* 測試用：網址加 ?today=2026-11-13 可以假裝今天是那天；?today= 留空就取消 */
let TEST_TODAY="";
try{const q=new URLSearchParams(location.search);if(q.has("today")){const v=q.get("today");if(v)sessionStorage.setItem("testToday",v);else sessionStorage.removeItem("testToday")}TEST_TODAY=sessionStorage.getItem("testToday")||""}catch(_){}
if(!/^\d{4}-\d{2}-\d{2}$/.test(TEST_TODAY))TEST_TODAY="";
function todayStr(){return TEST_TODAY||fmt(new Date())}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function dayCount(a,b){return Math.round((parse(b)-parse(a))/864e5)+1}
function md(s){const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()}
function wdOf(s){return WD[parse(s).getDay()]}
function rel(s){const t=todayStr();if(s===t)return"今天";if(s===addDays(t,1))return"明天";if(s===addDays(t,-1))return"昨天";return md(s)}
function span(e){return e.start===e.end?`${md(e.start)}（${wdOf(e.start)}）`:`${md(e.start)}（${wdOf(e.start)}）→ ${md(e.end)}（${wdOf(e.end)}）`}
function ago(iso){if(!iso)return"";const t=new Date(iso);if(isNaN(t))return"";const m=(Date.now()-t)/6e4;if(m<1)return"剛剛";if(m<60)return Math.floor(m)+" 分鐘前";if(m<1440)return Math.floor(m/60)+" 小時前";return (t.getMonth()+1)+"/"+t.getDate()}
function esc(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function validDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function now(){return new Date().toISOString()}
function rid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}
function norm(s){return String(s||"").toLowerCase().replace(/[\s\-_.·・,，、()（）\[\]【】\/]/g,"")}
function matchGear(name){const n=norm(name);if(!n)return null;for(const[id,g]of S.gear){if(norm(g.name)===n)return id;if((g.aliases||[]).some(a=>norm(a)===n))return id}return null}
function guessCat(n){
  const s=String(n||"").toLowerCase();
  if(/燈|dmx|光|搖頭|煙/.test(s))return"燈光";
  if(/爵士鼓|套鼓|銅鈸|cymbal|木箱鼓|cajon|定音鼓|鍵盤|keyboard|鋼琴|piano|吉他|guitar|貝斯|音箱|管樂|弦樂|管弦|樂器|backline/.test(s))return"樂器";
  if(/架/.test(s))return"架類";
  if(/無線|手握|腰包|pack/.test(s))return"無線";
  if(/耳返|iem/.test(s))return"耳返";
  if(/喇叭|sub|超低|監聽|wedge|\d{2}吋/.test(s))return"喇叭";
  if(/控台|混音|stage ?box|console/.test(s))return"混音台";
  if(/擴大|amp/.test(s))return"擴大機";
  if(/麥克風|mic|鼓組/.test(s))return"麥克風";
  if(/線|xlr|cable|多芯|槽|snake/.test(s))return /槽/.test(s)?"雜項":"線材";
  return"其他";
}
const phase=e=>PH[e?.phase]?e.phase:"pick";
/* 顯示用階段：按了出發但還沒到進場日 = 已抓好（ready），到日期自動變演出中 */
const stage=e=>{const p=phase(e);return p==="show"&&todayStr()<e.start?"ready":p};
function itemsOf(e){return Object.entries(e.items||{}).filter(([,q])=>+q>0)}
function pendList(e,st){return Object.entries(e.pending||{}).filter(([,p])=>p&&p.status===st)}
function openPend(e){return pendList(e,"open").sort((a,b)=>String(a[1].at||"").localeCompare(String(b[1].at||"")))}
function donePend(e){return pendList(e,"done").sort((a,b)=>String(b[1].doneAt||"").localeCompare(String(a[1].doneAt||"")))}
function addedFor(e,gid){let n=0;for(const[,p]of pendList(e,"done"))if(p.gid===gid)n+=+p.qty||0;for(const[,l]of Object.entries(e.log||{}))if(l&&l.type==="in"&&l.gid===gid)n+=+l.qty||0;return n}
function gName(gid,fb){return S.gear.get(gid)?.name||fb||"已刪除的設備"}
function gUnit(gid){return S.gear.get(gid)?.unit||""}
function sortedEvents(){return [...S.events].sort((a,b)=>a[1].start.localeCompare(b[1].start)||String(a[1].name).localeCompare(String(b[1].name),"zh-Hant"))}
function catSort(a,b){const ia=CATS.indexOf(a),ib=CATS.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,"zh-Hant")}
function groupByCat(gids){const m=new Map();for(const id of gids){const c=S.gear.get(id)?.category||"其他";if(!m.has(c))m.set(c,[]);m.get(c).push(id)}return [...m.keys()].sort(catSort).map(c=>[c,m.get(c).sort((a,b)=>gName(a).localeCompare(gName(b),"zh-Hant"))])}
function openRepairs(){return [...S.repairs].filter(([,r])=>r.status!=="done")}
function totalOpenPend(){let n=0;for(const[,e]of S.events)if(phase(e)!=="done")n+=openPend(e).length;return n}
function overdue(e){return phase(e)==="show"&&e.end<todayStr()}
const isPhoto=p=>typeof p==="string"&&/^data:image\//.test(p);
function who(id){return id&&id===S.me?"你":id?"同事":"有人"}

/* ---------- 本機資料庫 ----------
   測試版先把資料存在這支手機（IndexedDB）。介面跟原型的共用資料庫一樣：
   collection().doc().set / update（巢狀欄位合併）/ delete、add、onSnapshot。
   之後換成 Firebase 時只要換掉這一段。 */
function isObj(v){return v!==null&&typeof v==="object"&&!Array.isArray(v)}
function deepMerge(a,b){const o=isObj(a)?{...a}:{};for(const[k,v]of Object.entries(b||{}))o[k]=isObj(v)?deepMerge(o[k],v):v;return o}
const LDB=(()=>{
  const COLS=["gear","events","repairs","templates"],data={},subs={};let idb=null;
  COLS.forEach(c=>{data[c]=new Map();subs[c]=[]});
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  function tx(c,fn){return new Promise((res,rej)=>{const t=idb.transaction(c,"readwrite");fn(t.objectStore(c));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
  function emit(c){const docs=[...data[c]].map(([id,v])=>({id,data:()=>structuredClone(v)}));subs[c].forEach(f=>{try{f({docs})}catch(e){console.error(e)}})}
  async function write(c,id,v){await tx(c,s=>v==null?s.delete(id):s.put(v,id));if(v==null)data[c].delete(id);else data[c].set(id,v);emit(c)}
  function doc(c,id){id=id||rid();return{id,
    set:v=>write(c,id,structuredClone(v)),
    update:v=>data[c].has(id)?write(c,id,deepMerge(data[c].get(id),structuredClone(v))):Promise.reject({code:"not_found"}),
    delete:()=>write(c,id,null)}}
  async function loadAll(obj){for(const c of COLS){if(c==="templates"&&!obj[c])continue;await tx(c,s=>{s.clear();for(const[id,v]of Object.entries(obj[c]||{}))s.put(v,id)});data[c]=new Map(Object.entries(obj[c]||{}));emit(c)}}
  return{
    async init(){
      const r=indexedDB.open("gearboard",2);r.onupgradeneeded=()=>COLS.forEach(c=>{if(!r.result.objectStoreNames.contains(c))r.result.createObjectStore(c)});
      idb=await req(r);
      for(const c of COLS){const s=idb.transaction(c).objectStore(c),[keys,vals]=await Promise.all([req(s.getAllKeys()),req(s.getAll())]);data[c]=new Map(keys.map((k,i)=>[k,vals[i]]))}
      let seeded=false;try{seeded=localStorage.getItem("seeded")==="1"}catch(_){}
      if(!seeded&&!data.gear.size&&!data.events.size){try{const res=await fetch("seed.json",{cache:"no-store"});if(res.ok)await loadAll(await res.json())}catch(_){}}
      try{localStorage.setItem("seeded","1")}catch(_){}
    },
    collection:c=>({doc:id=>doc(c,id),add:v=>{const d=doc(c);return d.set(v).then(()=>d)},onSnapshot(fn){subs[c].push(fn);setTimeout(()=>fn({docs:[...data[c]].map(([id,v])=>({id,data:()=>structuredClone(v)}))}));return()=>{subs[c]=subs[c].filter(x=>x!==fn)}}}),
    dump:()=>Object.fromEntries(COLS.map(c=>[c,Object.fromEntries(data[c])])),
    restore:loadAll,
  };
})();

/* ---------- 庫存計算 ----------
   一場活動在「抓貨／演出中」都佔用它的器材（依日期）；演出中但過了撤場還沒歸還，視為一直佔用。
   已歸還的活動不佔用。維修中的數量也從庫存扣掉。沒填總數量的器材不限制。 */
function hasQty(g){return !!g&&typeof g.qty==="number"&&isFinite(g.qty)}
function effEnd(e){return overdue(e)?"9999-12-31":e.end}
function rangeOf(e){return[e.start,overdue(e)?todayStr():e.end]}
function heldOn(day,gid,exclude){let n=0;for(const[id,e]of S.events){if(id===exclude||phase(e)==="done")continue;if(e.start<=day&&day<=effEnd(e))n+=+(e.items||{})[gid]||0}return n}
function inRepair(gid){let n=0;for(const[,r]of S.repairs)if(r.status!=="done"&&r.gid===gid)n+=+r.qty||1;return n}
function availFor(gid,start,end,exclude){
  const g=S.gear.get(gid);if(!hasQty(g))return Infinity;
  let peak=0;for(let d=start,i=0;d<=end&&i<400;d=addDays(d,1),i++)peak=Math.max(peak,heldOn(d,gid,exclude));
  return Math.max(0,g.qty-inRepair(gid)-peak);
}
function outToday(gid){let n=0;const t=todayStr();for(const[,e]of S.events)if(phase(e)==="show"&&e.start<=t&&t<=effEnd(e))n+=+(e.items||{})[gid]||0;return n}

let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){S.canWrite=false;render();return"你沒有編輯權限，這次修改沒有存到。"}

function closeSheet(){$("sheetRoot").innerHTML="";if(imp.ctl)imp.ctl.abort();rs=null;mp=null}
function mountSheet(title,body,{save="儲存",onSave,noSave}={}){
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head pad"><button type="button" id="sCancel">${noSave?"關閉":"取消"}</button><h2>${esc(title)}</h2>${noSave?"<span></span>":`<button type="button" class="save" id="sSave" ${S.canWrite&&S.dbOk!==false?"":"disabled"}>${esc(save)}</button>`}</div><div class="sheet-body pad" id="sBody">${body}</div></div></div>`;
  $("sCancel").onclick=closeSheet;
  $("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
  if(!noSave)$("sSave").onclick=async()=>{const b=$("sSave");b.disabled=true;try{await onSave()}finally{if(b.isConnected)b.disabled=!(S.canWrite&&S.dbOk!==false)}};
}
function setErr(m){const el=$("sErr");if(el){el.textContent=m||"";el.hidden=!m}}
function openActions(list){
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="選擇動作"><div class="grab"></div><div class="actions pad"><div class="list">${list.map((a,i)=>`<button type="button" data-a="${i}" class="${a.danger?"dangerous":""}">${a.icon||""}<span>${esc(a.label)}${a.sub?`<small>${esc(a.sub)}</small>`:""}</span></button>`).join("")}</div><button type="button" class="cancel" id="aCancel">取消</button></div></div></div>`;
  $("aCancel").onclick=closeSheet;$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim"){closeSheet();return}const b=e.target.closest("[data-a]");if(b){closeSheet();list[+b.dataset.a].fn()}});
}
function stepperHtml(id,val,max){return`<span class="stepper"><button type="button" data-sstep="-1" data-for="${id}" aria-label="減少">−</button><input id="${id}" inputmode="numeric" value="${val}" ${max!=null?`data-max="${max}"`:""} aria-label="數量"><button type="button" data-sstep="1" data-for="${id}" aria-label="增加">+</button></span>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-sstep]");if(!b)return;const inp=$(b.dataset.for),mx=inp.dataset.max!=null?+inp.dataset.max:Infinity,mn=inp.dataset.min!=null?+inp.dataset.min:1;inp.value=Math.min(mx,Math.max(mn,(Math.floor(+inp.value)||0)+(+b.dataset.sstep)));inp.dispatchEvent(new Event("input",{bubbles:true}))});
function eventOptions(sel,{none,exclude,label="不指定"}={}){const list=sortedEvents().filter(([id,e])=>id!==exclude&&(phase(e)!=="done"||id===sel));return (none?`<option value="">${label}</option>`:"")+list.map(([id,e])=>`<option value="${esc(id)}" ${id===sel?"selected":""}>${esc(e.name)}（${md(e.start)}）</option>`).join("")}

/* pending form */
function openPendForm(eid){
  mountSheet("新增待補",`
    ${eid?"":`<div class="field"><label for="pEv">哪一場活動</label><select id="pEv">${eventOptions(null,{})}</select></div>`}
    <div class="field"><label for="pName">缺什麼器材</label><input id="pName" list="gearNames" placeholder="例如：無線麥克風" autocomplete="off"><p class="hint" id="pCap"></p></div>
    <div class="field"><label for="pQty">數量</label>${stepperHtml("pQty",1)}</div>
    <div class="field"><label for="pNote">備註（選填）</label><input id="pNote" placeholder="例如：下午 3 點前要到" autocomplete="off"></div>
    <p class="err" id="sErr" hidden></p>`,{save:"新增",onSave:async()=>{
      const ev=eid||$("pEv")?.value,name=$("pName").value.trim(),qty=Math.max(1,Math.floor(+$("pQty").value)||0);
      if(!ev)return setErr("請先建立活動。");if(!name)return setErr("請填缺的器材。");
      const e=S.events.get(ev),gid0=matchGear(name);
      if(gid0){const[s,en]=rangeOf(e),av=availFor(gid0,s,en,ev)-(+(e.items||{})[gid0]||0);if(qty>av)return setErr(av>0?`倉庫這段期間只剩 ${av}${gUnit(gid0)}。`:"倉庫這段期間已經沒有了，可以從演出中的其他場「轉借」。")}
      try{const gid=await ensureGear(name);const pid=rid();await evRef(ev).update({pending:{[pid]:{gid,name,qty,note:$("pNote").value.trim(),status:"open",by:S.me||null,at:now()}}});closeSheet();toast("已加入待補")}catch(err){setErr(errMsg(err))}
    }});
  const upd=()=>{const ev=eid||$("pEv")?.value,e=S.events.get(ev),g=matchGear($("pName").value),cap=$("pCap"),inp=$("pQty");if(!e||!g||!hasQty(S.gear.get(g))){cap.textContent="";delete inp.dataset.max;return}const[s,en]=rangeOf(e),av=Math.max(0,availFor(g,s,en,ev)-(+(e.items||{})[g]||0));cap.textContent=av?`倉庫這段期間還有 ${av}${gUnit(g)}`:"倉庫這段期間已經沒有了";inp.dataset.max=Math.max(1,av)};
  $("pName").addEventListener("input",upd);$("pEv")?.addEventListener("change",upd);
  setTimeout(()=>$("pName")?.focus(),250);
}

/* transfer (演出中借去別場) */
function openTransfer(fromId){
  const e=S.events.get(fromId),ids=itemsOf(e).map(([g])=>g);
  if(!ids.length){toast("這場沒有器材可以轉借。");return}
  const targets=sortedEvents().filter(([id,x])=>id!==fromId&&phase(x)!=="done");
  if(!targets.length){toast("沒有其他進行中的活動可以轉過去。");return}
  mountSheet("轉借到其他場",`
    <p class="hint">器材還沒回倉庫就先拿去別場，數量會從這場扣掉、加到那一場。那場如果有同樣器材的待補，會自動標成已送達。</p>
    <div class="field"><label for="tGear">哪個器材</label><select id="tGear">${ids.map(g=>`<option value="${esc(g)}">${esc(gName(g))}（這場有 ${e.items[g]}）</option>`).join("")}</select></div>
    <div class="field"><label for="tQty">數量</label>${stepperHtml("tQty",1,+e.items[ids[0]])}</div>
    <div class="field"><label for="tTo">轉到哪一場</label><select id="tTo">${targets.map(([id,x])=>`<option value="${esc(id)}">${esc(x.name)}（${md(x.start)}，${PH[phase(x)][0]}）</option>`).join("")}</select><p class="hint" id="tHint"></p></div>
    <p class="err" id="sErr" hidden></p>`,{save:"轉借",onSave:async()=>{
      const gid=$("tGear").value,to=$("tTo").value,qty=Math.max(1,Math.floor(+$("tQty").value)||1),src=S.events.get(fromId),dst=S.events.get(to);
      const have=+(src.items||{})[gid]||0;if(qty>have)return setErr(`這場只有 ${have}。`);
      const at=now(),lid=rid();
      let left=qty;const pend={};
      for(const[pid,p]of openPend(dst))if(p.gid===gid&&left>=(+p.qty||0)){left-=+p.qty||0;pend[pid]={status:"done",doneBy:S.me||null,doneAt:at,via:`從「${src.name}」轉來`}}
      try{
        await evRef(fromId).update({items:{[gid]:have-qty},log:{[lid]:{type:"out",gid,qty,other:to,by:S.me||null,at}},...stamp()});
        await evRef(to).update({items:{[gid]:(+(dst.items||{})[gid]||0)+qty},pending:pend,log:{[lid]:{type:"in",gid,qty,other:fromId,by:S.me||null,at}},...stamp()});
        closeSheet();toast(`已把 ${gName(gid)} ×${qty} 轉到「${dst.name}」`);
      }catch(err){setErr(errMsg(err))}
    }});
  const upd=()=>{const g=$("tGear").value,to=$("tTo").value,dst=S.events.get(to);$("tQty").dataset.max=+e.items[g];if(+$("tQty").value>+e.items[g])$("tQty").value=e.items[g];const need=openPend(dst||{}).filter(([,p])=>p.gid===g).reduce((a,[,p])=>a+(+p.qty||0),0);$("tHint").textContent=need?`「${dst.name}」正好缺 ${need}，轉過去會一起標成已送達。`:""};
  $("tGear").onchange=upd;$("tTo").onchange=upd;upd();
}

/* return (歸還) */
let rs=null;
function openReturn(id){
  const e=S.events.get(id);
  rs={id,rows:itemsOf(e).map(([gid,q])=>({gid,q:+q,rep:0,tr:0,to:"",open:false})),note:""};
  mountSheet("歸還器材","",{save:"確認歸還",onSave:confirmReturn});
  renderReturn();
}
function renderReturn(){
  const b=$("sBody");if(!b||!rs)return;
  const targets=eventOptions("",{none:true,exclude:rs.id,label:"選一場"});
  const anyRep=rs.rows.some(r=>r.rep>0),allFull=rs.rows.every(r=>!r.rep&&!r.tr);
  b.innerHTML=`<p class="hint">${allFull?"全部照數量回倉庫。有東西壞了或被拿去別場，點那一項的「有狀況」。":"有標記狀況的項目會照下面的數字處理，其餘回倉庫。"}</p>
  ${rs.rows.length?`<div class="list">${rs.rows.map((r,i)=>{const ret=r.q-r.rep-r.tr;return`<div class="rrow"><div class="top"><span class="rn"><b>${esc(gName(r.gid))}</b><small>帶出 ${r.q}${esc(gUnit(r.gid))}${r.rep?` · 送修 ${r.rep}`:""}${r.tr?` · 轉場 ${r.tr}`:""}</small></span><span class="ret${ret<r.q?" part":""}">${ret}<small style="font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)"> 歸還</small></span><button type="button" class="mini" data-rx="${i}">${r.open?"收起":"有狀況"}</button></div>
    ${r.open?`<div class="rext"><div class="rl"><span>送修</span>${rstep(i,"rep",r.rep,r.q-r.tr)}</div><div class="rl"><span>轉到</span><select data-rto="${i}" aria-label="轉到哪一場">${targets.replace(`value="${esc(r.to)}"`,`value="${esc(r.to)}" selected`)}</select>${rstep(i,"tr",r.tr,r.q-r.rep)}</div></div>`:""}</div>`}).join("")}</div>`:`<div class="empty">這場沒有器材要歸還。</div>`}
  ${anyRep?`<div class="field"><label for="rsNote">送修說明</label><textarea id="rsNote" rows="2" placeholder="例如：一顆喇叭破音">${esc(rs.note)}</textarea></div>`:""}
  <p class="err" id="sErr" hidden></p>`;
  const n=$("rsNote");if(n)n.oninput=()=>rs.note=n.value;
}
function rstep(i,k,v,max){return`<span class="stepper"><button type="button" data-rs="${k}" data-i="${i}" data-d="-1" aria-label="減少" ${v?"":"disabled"}>−</button><input value="${v}" readonly aria-label="數量" tabindex="-1"><button type="button" data-rs="${k}" data-i="${i}" data-d="1" aria-label="增加" ${v>=max?"disabled":""}>+</button></span>`}
document.addEventListener("click",e=>{
  if(!rs||!$("sBody"))return;
  const x=e.target.closest("[data-rx]");if(x){const r=rs.rows[+x.dataset.rx];r.open=!r.open;renderReturn();return}
  const s=e.target.closest("[data-rs]");if(s){const r=rs.rows[+s.dataset.i],k=s.dataset.rs;r[k]=Math.max(0,Math.min(r.q-(k==="rep"?r.tr:r.rep),r[k]+(+s.dataset.d)));renderReturn()}
});
document.addEventListener("change",e=>{const s=e.target.closest("[data-rto]");if(s&&rs){rs.rows[+s.dataset.rto].to=s.value}});
async function confirmReturn(){
  const id=rs.id,src=S.events.get(id);
  for(const r of rs.rows)if(r.tr&&!r.to)return setErr(`「${gName(r.gid)}」要轉到哪一場？請選一場。`);
  const at=now(),summary={};
  try{
    const byTo=new Map();
    for(const r of rs.rows){summary[r.gid]={ret:r.q-r.rep-r.tr,rep:r.rep,tr:r.tr,to:r.tr?r.to:null};if(r.tr){if(!byTo.has(r.to))byTo.set(r.to,[]);byTo.get(r.to).push(r)}}
    for(const[to,rows]of byTo){
      const dst=S.events.get(to);if(!dst)continue;const items={},log={},pend={};
      for(const r of rows){items[r.gid]=(items[r.gid]??(+(dst.items||{})[r.gid]||0))+r.tr;log[rid()]={type:"in",gid:r.gid,qty:r.tr,other:id,by:S.me||null,at};
        let left=r.tr;for(const[pid,p]of openPend(dst))if(p.gid===r.gid&&left>=(+p.qty||0)){left-=+p.qty||0;pend[pid]={status:"done",doneBy:S.me||null,doneAt:at,via:`從「${src.name}」轉來`}}}
      await evRef(to).update({items,log,pending:pend,...stamp()});
    }
    for(const r of rs.rows)if(r.rep)await db.collection("repairs").add({gid:r.gid,gearName:gName(r.gid),qty:r.rep,eventId:id,issue:rs.note.trim()||"歸還時回報需要維修",photo:null,status:"open",fixNote:"",by:S.me||null,at,...stamp()});
    const log={};for(const r of rs.rows)if(r.tr)log[rid()]={type:"out",gid:r.gid,qty:r.tr,other:r.to,by:S.me||null,at};
    await evRef(id).update({phase:"done",returnedAt:at,returnedBy:S.me||null,returnSummary:summary,log,...stamp()});
    rs=null;closeSheet();buzz();toast("已歸還，庫存數量已回到倉庫");window.scrollTo(0,0);
  }catch(err){setErr(errMsg(err))}
}

/* repair form */
let repFile=null;
function openRepairForm({eventId}){
  repFile=null;
  mountSheet("回報損壞",`
    <div class="field"><label for="rName">哪個器材</label><input id="rName" list="gearNames" placeholder="例如：燈具" autocomplete="off"></div>
    <div class="row2"><div class="field"><label for="rQty">數量</label>${stepperHtml("rQty",1)}</div><div class="field"><label for="rEv">在哪場發現</label><select id="rEv">${eventOptions(eventId||"",{none:true})}</select></div></div>
    <div class="field"><label for="rIssue">哪裡壞了</label><textarea id="rIssue" rows="3" placeholder="例如：開機沒反應，電源線換過還是一樣"></textarea></div>
    <label class="filebtn">${IC.img}<span id="rFileLbl">拍照或選照片（選填）</span><input type="file" id="rFile" accept="image/*"></label><img class="thumb" id="rThumb" alt="" hidden>
    <p class="hint">送修中的數量會先從庫存扣掉，標成「已修好」就回到可用數量。</p>
    <p class="err" id="sErr" hidden></p>`,{save:"送出",onSave:async()=>{
      const name=$("rName").value.trim(),issue=$("rIssue").value.trim();
      if(!name)return setErr("請填哪個器材壞了。");if(!issue)return setErr("請簡單描述哪裡壞了。");

      try{if(repFile){$("sSave").textContent="處理中…";photo=await blobToDataUrl(await shrink(repFile))}}
      catch(err){$("sSave").textContent="送出";return setErr("照片處理失敗，可以先不附照片送出。")}
      try{await db.collection("repairs").add({gid:matchGear(name),gearName:name,qty:Math.max(1,Math.floor(+$("rQty").value)||1),eventId:$("rEv").value||null,issue,photo,status:"open",fixNote:"",by:S.me||null,at:now(),...stamp()});closeSheet();toast("已送出維修回報")}
      catch(err){$("sSave").textContent="送出";setErr(errMsg(err))}
    }});
  const f=$("rFile");if(f)f.onchange=()=>{repFile=f.files[0]||null;const th=$("rThumb");if(repFile){th.src=URL.createObjectURL(repFile);th.hidden=false;$("rFileLbl").textContent="換一張照片"}else th.hidden=true};
}
async function shrink(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.78))}catch(_){return file}}
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function openRepair(id){
  const r=S.repairs.get(id);if(!r)return;
  let st=r.status||"open";const ev=r.eventId?S.events.get(r.eventId):null;
  mountSheet("維修紀錄",`
    ${isPhoto(r.photo)?`<img class="bigimg" src="${esc(r.photo)}" alt="損壞照片">`:""}
    <div><div style="font-size:20px;font-weight:700">${esc(gName(r.gid,r.gearName))} <span class="num">×${+r.qty||1}</span></div><p style="margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.issue||"")}</p></div>
    <div class="kv"><div><b>回報</b><span>${who(r.by)} · ${ago(r.at)}</span></div>${ev?`<div><b>活動</b><span>${esc(ev.name)}（${md(ev.start)}）</span></div>`:""}${r.updatedAt&&r.updatedAt!==r.at?`<div><b>最後更新</b><span>${who(r.updatedBy)} · ${ago(r.updatedAt)}</span></div>`:""}</div>
    <div class="field"><label>狀態</label><div class="seg statusseg" role="group">${Object.entries(ST).map(([k,[l]])=>`<button type="button" data-st="${k}" aria-pressed="${st===k}" ${S.canWrite?"":"disabled"}>${l}</button>`).join("")}</div></div>
    <div class="field"><label for="rFix">處理紀錄</label><textarea id="rFix" rows="3" placeholder="例如：11/5 送原廠，換電源板" ${S.canWrite?"":"disabled"}>${esc(r.fixNote||"")}</textarea></div>
    <p class="err" id="sErr" hidden></p>
    ${S.canWrite?`<button type="button" class="danger" id="rDel">刪除這筆紀錄</button>`:""}`,{onSave:async()=>{
      try{await db.collection("repairs").doc(id).update({status:st,fixNote:$("rFix").value.trim(),...stamp()});closeSheet();toast(st==="done"?"已修好，數量回到庫存":"已更新維修狀態")}catch(err){setErr(errMsg(err))}
    }});
  $("sBody").addEventListener("click",e=>{const b=e.target.closest("[data-st]");if(!b)return;st=b.dataset.st;$("sBody").querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.st===st))});
  const del=$("rDel");if(del)del.onclick=async()=>{if(!arm(del,"再按一次確定刪除"))return;try{await db.collection("repairs").doc(id).delete();closeSheet();toast("已刪除紀錄")}catch(err){setErr(errMsg(err))}};
  fillNames();
}

/* gear form */
function openGearForm(id){

function takeResult(r){

function parseText(t){
  const items=[],notes=[];let title="",ctx="";const seen=new Map();
  const push=(name,qty,unit,note)=>{name=name.replace(/[：:]+$/,"").trim();if(!name)return;if(ctx)note=ctx+(note?"・"+note:"");const k=norm(name);if(seen.has(k)){const it=seen.get(k);it.qty+=qty;if(note&&!it.note.includes(note))it.note=[it.note,note].filter(Boolean).join("；");return}const it={name,qty,unit:UNITS.includes(unit)?unit:"",note:note||""};seen.set(k,it);items.push(it)};
  t.split(/\r?\n/).forEach(raw=>{
    const s=raw.replace(/^[\s•·●○▪\-–—☐□✓✔]+/,"").trim();
    if(!s){ctx="";return}
    let note="",core=s,m;
    const pm=s.match(/[（(]([^()（）]*)[)）]\s*$/);if(pm){note=pm[1].trim();core=s.slice(0,pm.index).trim()}
    if(/[:：]$/.test(core)&&core.length<=8){ctx=core.replace(/[:：]$/,"");return}
    /* 無線(4手握，4腰包) → 「無線 手握」4、「無線 腰包」4（括號裡至少兩段「數量＋名稱」才拆） */
    if(note&&core&&!/\d/.test(core)){const parts=note.split(/[，,、\/]/).map(x=>x.trim()).filter(Boolean),pm2=parts.map(x=>x.match(/^(\d+)\s*([^\d\s].{0,8})$/));if(parts.length>=2&&pm2.every(Boolean)){pm2.forEach(m=>push(core+" "+m[2],+m[1],"",""));return}}
    if((m=core.match(/^(.+?)\s*[*＊×✕xX]\s*(\d+)\s*([^\d\s]{0,2})$/))){push(m[1],+m[2],m[3],note);return}
    if((m=core.match(/^(\d+)\s*([^\d\s][^\s]{0,11})$/))){if(ctx){notes.push(`${ctx}：${m[2]} ×${m[1]}`);return}push(m[2],+m[1],"",note);return}
    if(!title&&!items.length&&!/\d/.test(core)&&core.length<=10){title=core;if(note)notes.push(note);return}
    if(/明天|今天|後天|出門|出發|集合|抓貨|進場|撤場|到場|裝台/.test(core)||(/\s/.test(core)&&/[一-鿿]/.test(core)&&core.length>6)){notes.push(s);return}
    push(core,1,"",note);
  });
  return{title,items,note:notes.join("\n")};
}
/* 交給 AI：產生提示詞給使用者貼到自己的 Claude / ChatGPT，再把回覆貼回來（不花錢、不用 API 金鑰） */

今天是 ${todayStr()}。
公司已有的器材名稱（如果是同一個東西，name 請完全照抄這裡的寫法）：
${names.length?names.join("、"):"（目前沒有）"}
分類只能用：${CATS.join("、")}

規則：
- 每一種器材一筆：{"name":字串,"qty":整數,"unit":"支/顆/台/箱/片/套/組 之類，不確定就空字串","category":上面的分類之一,"note":"這項的補充說明，沒有就空字串"}
- 數量常寫成「名稱*數量」「名稱x數量」「數量名稱」；沒寫數量就是 1。

只回 JSON，不要加任何說明文字，格式：{"title":"","venue":"","start":"","end":"","eventNote":"","items":[]}
${hasText?"\n清單文字：\n"+imp.text.slice(0,8000):""}`;

function copyText(t,el){

  fallback();

}
function readReply(){
  const raw=String(imp.reply||"").replace(/```(?:json)?/gi,""),a=raw.indexOf("{"),z=raw.lastIndexOf("}");
  let r=null;try{if(a>=0&&z>a)r=JSON.parse(raw.slice(a,z+1))}catch(_){}

}
async function applyImport(){
  const rows=imp.rows.filter(r=>r.name.trim());
  if(!rows.length)return setErr("沒有器材可以加入。");
  const m=imp.meta;
  if(imp.mode==="new"){if(!m.title.trim())return setErr("請填活動名稱。");if(!validDate(m.start)||!validDate(m.end))return setErr("請選進場和撤場日期。");if(m.end<m.start)return setErr("撤場日期要在進場日期之後。")}
  try{
    const add={},notes=[],clamped=[];
    for(const r of rows){
      const gid=await ensureGear(r.name,{category:r.category,unit:r.unit});
      const exp=expandNeed(gid,r.qty);
      for(const[k,q0]of Object.entries(exp||{[gid]:r.qty})){
        const av=impAvail(k)-(add[k]||0);let q=q0;
        if(av!==Infinity&&q>av){clamped.push(`${gName(k)} ${av}`);q=Math.max(0,av)}
        if(q>0)add[k]=(add[k]||0)+q;
      }
      if(exp)notes.push(`客戶寫「${r.name}」×${r.qty} → ${Object.entries(exp).map(([k,q])=>gName(k)+" ×"+q).join("、")}`);
      if(r.note)notes.push(`${r.name}：${r.note}`);
    }
    const note=[m.note.trim(),...notes].filter(Boolean).join("\n");
    const msg=clamped.length?`庫存不夠，已調低：${clamped.join("、")}`:"";
    if(imp.mode==="new"){
      const ref=db.collection("events").doc();
      await ref.set({name:m.title.trim(),venue:m.venue.trim(),start:m.start,end:m.end,note,phase:"pick",items:add,picked:{},pending:{},log:{},createdBy:S.me||null,...stamp()});
      closeSheet();toast(msg||"已建立活動");evTab="pick";openDetail(ref.id);
    }else{
      const e=S.events.get(imp.eid),items={};for(const[g,q]of Object.entries(add))items[g]=(+(e.items||{})[g]||0)+q;
      const upd={items,...stamp()};if(note)upd.note=[e.note,note].filter(Boolean).join("\n");
      await evRef(imp.eid).update(upd);closeSheet();toast(msg||`已加入 ${Object.keys(add).length} 項器材`);render();
    }
  }catch(err){setErr(errMsg(err))}
}

/* ---------- 指定型號（客戶用語 → 實際器材） ---------- */
function isNeed(g){return !!g&&g.kind==="need"}
function mapNames(m){return Object.keys(m||{}).filter(k=>S.gear.has(k)&&+m[k]>0).map(k=>gName(k)).join("、")}
function expandNeed(gid,qty){
  const g=S.gear.get(gid),m=g&&g.mapTo;if(!isNeed(g)||!m)return null;
  const ent=Object.entries(m).filter(([k,v])=>+v>0&&k!==gid&&S.gear.has(k));if(!ent.length)return null;
  const T=ent.reduce((a,[,v])=>a+(+v),0),out={};let left=qty;
  ent.forEach(([k,v],i)=>{const n=i===ent.length-1?left:Math.min(left,Math.round(qty*v/T));if(n>0)out[k]=n;left-=n});
  return out;
}
function needChip(gid){
  const g=S.gear.get(gid);if(!g||!S.canWrite)return"";
  if(isNeed(g)&&mapNames(g.mapTo))return`<small class="chipline"><span class="badge pick">點一下換成：${esc(mapNames(g.mapTo))}</span></small>`;
  if(!hasQty(g)&&g.kind!=="gear")return`<small class="chipline"><span class="badge pick">指定型號</span></small>`;
  return"";
}
let mp=null;
function openMap({eid,gid}){
  const g=S.gear.get(gid);if(!g)return;const e=eid?S.events.get(eid):null;
  const qty=e?(+(e.items||{})[gid]||0):1;
  const pre=e?(expandNeed(gid,qty)||{}):{...(g.mapTo||{})};
  mp={eid,gid,qty,alloc:pre,q:"",remember:true,busy:false,ctl:null};
  mountSheet(e?"指定實際器材":"客戶用語對應","",{save:e?"套用":"儲存",onSave:saveMap});
  renderMap();
}
function mpAllowed(id){
  if(!mp.eid)return Infinity;const e=S.events.get(mp.eid),[s,en]=rangeOf(e),av=availFor(id,s,en,mp.eid);
  return av===Infinity?Infinity:Math.max(0,av-(+(e.items||{})[id]||0));
}
function renderMap(){
  const b=$("sBody");if(!b||!mp)return;const g=S.gear.get(mp.gid);if(!g){closeSheet();return}
  b.innerHTML=`<div><div class="mphead">「${esc(g.name)}」${mp.eid?` <span class="num">×${mp.qty}</span>`:""}</div><p class="hint" style="margin-top:4px">${mp.eid?"這是清單上的寫法。選出實際要抓的器材和數量，這一行會被換掉。":"客戶寫這個名稱時，匯入會自動換成下面的器材；數字是分配比例。"}</p></div>
    <div id="mProg"></div>
    <div class="btnrow"><label class="search" style="flex:3">${IC.search}<input id="mQ" type="search" placeholder="搜尋公司器材，或輸入新型號" value="${esc(mp.q)}" autocomplete="off" aria-label="搜尋器材"></label>${sample?`<button type="button" class="btn" data-mai style="flex:1">${mp.busy?"讀取中…":"AI 建議"}</button>`:""}</div>
    <div id="mList"></div>
    ${mp.eid?`<label class="rem"><input type="checkbox" id="mRem" ${mp.remember?"checked":""}><span>以後看到「${esc(g.name)}」自動換成這些</span></label>`:""}
    ${mp.eid&&!hasQty(g)&&!isNeed(g)?`<button type="button" class="link" data-mself style="align-self:flex-start">「${esc(g.name)}」本身就是實際器材，不用換</button>`:""}
    ${!mp.eid&&isNeed(g)?`<button type="button" class="danger" id="mDel">取消這個對應</button>`:""}
    <p class="err" id="sErr" hidden></p>`;
  const r=$("mRem");if(r)r.onchange=()=>mp.remember=r.checked;
  const d=$("mDel");if(d)d.onclick=async()=>{if(!arm(d,"再按一次確定取消"))return;const{mapTo,...rest}=S.gear.get(mp.gid);try{await db.collection("gear").doc(mp.gid).set({...rest,kind:"gear",...stamp()});closeSheet();toast("已取消對應")}catch(err){setErr(errMsg(err))}};
  renderMapList();
}
function renderMapList(){
  const g=S.gear.get(mp.gid),q=norm(mp.q),cat=g.category&&g.category!=="其他"?g.category:guessCat(g.name);
  const sum=Object.values(mp.alloc).reduce((a,v)=>a+(+v||0),0);
  const prog=$("mProg");if(prog)prog.innerHTML=mp.eid?`<div class="progress"><div class="top"><b class="${sum===mp.qty?"":""}">${sum} / ${mp.qty}</b><span>${sum===mp.qty?"數量對上了":sum<mp.qty?`還差 ${mp.qty-sum}`:`比清單多 ${sum-mp.qty}`}</span></div><div class="bar${sum>=mp.qty?" full":""}"><i style="width:${Math.min(100,mp.qty?sum/mp.qty*100:0)}%"></i></div></div>`:"";
  let c=[...S.gear].filter(([id,x])=>id!==mp.gid&&!isNeed(x)&&(!q||norm(x.name).includes(q)||norm(x.category).includes(q)||(x.aliases||[]).some(a=>norm(a).includes(q))));
  const rank=([id,x])=>(+mp.alloc[id]>0?0:x.category===cat?1:2);
  c.sort((a,b)=>rank(a)-rank(b)||a[1].name.localeCompare(b[1].name,"zh-Hant"));
  if(!q)c=c.slice(0,40);
  const el=$("mList");if(!el)return;
  el.innerHTML=(c.length?`<div class="list">${c.map(([id,x])=>{
    const n=+mp.alloc[id]||0,al=mpAllowed(id),mx=al===Infinity?999:al;
    const info=[x.category||"",mp.eid?(al===Infinity?"沒填庫存":`可用 ${al}`):(hasQty(x)?`共 ${x.qty}`:"")].filter(Boolean).join(" · ");
    return`<div class="row${n?" chosen":""}"><span class="rn">${esc(x.name)}<small class="${mp.eid&&al!==Infinity&&n>=al?"cap low":""}">${esc(info)}</small></span><span class="stepper"><button type="button" data-mstep="-1" data-id="${esc(id)}" aria-label="減少" ${n?"":"disabled"}>−</button><input value="${n}" readonly tabindex="-1" aria-label="${esc(x.name)} 數量"><button type="button" data-mstep="1" data-id="${esc(id)}" aria-label="增加" ${n>=mx?"disabled":""}>+</button></span></div>`;
  }).join("")}</div>`:`<div class="empty" style="padding:14px">${q?"公司器材裡找不到這個名稱":"公司器材清單還是空的"}</div>`)
  +(q&&!matchGear(mp.q)?`<button type="button" class="btn ghost" data-mnew style="width:100%;margin-top:8px">＋ 新增「${esc(mp.q.trim())}」並使用</button>`:"");
}
document.addEventListener("input",e=>{if(e.target.id==="mQ"&&mp){mp.q=e.target.value;renderMapList()}});
document.addEventListener("click",async e=>{
  if(!mp||!$("mList"))return;
  const s=e.target.closest("[data-mstep]");if(s){const id=s.dataset.id,al=mpAllowed(id),mx=al===Infinity?999:al;mp.alloc[id]=Math.max(0,Math.min(mx,(+mp.alloc[id]||0)+(+s.dataset.mstep)));if(!mp.alloc[id])delete mp.alloc[id];renderMapList();return}
  if(e.target.closest("[data-mnew]")){const name=mp.q.trim();if(!name)return;try{const id=await ensureGear(name);await db.collection("gear").doc(id).update({kind:"gear"});const sum=Object.values(mp.alloc).reduce((a,v)=>a+(+v||0),0);mp.alloc[id]=Math.max(1,mp.qty-sum);mp.q="";$("mQ").value="";renderMapList()}catch(err){setErr(errMsg(err))}return}
  if(e.target.closest("[data-mself]")){try{await db.collection("gear").doc(mp.gid).update({kind:"gear",...stamp()});closeSheet();toast("好，這項就照原名稱抓")}catch(err){setErr(errMsg(err))}return}
  const ai=e.target.closest("[data-mai]");if(ai&&!mp.busy&&sample){
    const g=S.gear.get(mp.gid);mp.busy=true;ai.textContent="讀取中…";ai.disabled=true;
    const list=[...S.gear].filter(([id,x])=>id!==mp.gid&&!isNeed(x)).map(([id,x])=>`${x.name}（${x.category||"其他"}${mp.eid?(mpAllowed(id)===Infinity?"":`，可用 ${mpAllowed(id)}`):""}）`).slice(0,300).join("\n");
    try{
      const r=await sample.json(`你是活動器材的組長。客戶需求寫「${g.name}」${mp.eid?`，數量 ${mp.qty}`:""}。
從下面的公司器材挑出實際要抓的器材和數量，名稱完全照抄清單，不能超過可用數量。沒有適合的就回空陣列。
公司器材：
${list||"（沒有）"}
只回 JSON：{"items":[{"name":"","qty":0}]}`,{modelTier:"quick"});
      const alloc={};for(const x of(r&&r.items)||[]){const id=matchGear(x.name);if(id&&id!==mp.gid&&!isNeed(S.gear.get(id))){const al=mpAllowed(id);alloc[id]=Math.max(1,Math.min(al===Infinity?999:al,Math.floor(+x.qty)||1))}}
      if(Object.keys(alloc).length)mp.alloc=alloc;else toast("AI 在公司器材裡找不到適合的，請手動選。");
    }catch(err){toast(err?.code==="rate_limited"?"AI 額度用完或太頻繁，稍後再試。":"AI 這次沒有建議成功，請手動選。")}
    mp.busy=false;renderMap();
  }
});
async function saveMap(){
  const alloc=Object.fromEntries(Object.entries(mp.alloc).filter(([k,v])=>+v>0&&S.gear.has(k)));
  if(!Object.keys(alloc).length)return setErr("至少選一項器材。");
  const g=S.gear.get(mp.gid);
  try{
    if(mp.eid){
      const e=S.events.get(mp.eid);
      for(const k in alloc){const al=mpAllowed(k);if(al!==Infinity&&alloc[k]>al)return setErr(`${gName(k)} 這段期間最多只能再排 ${al}。`)}
      const items={[mp.gid]:0},picked={[mp.gid]:false};
      for(const k in alloc){items[k]=(+(e.items||{})[k]||0)+alloc[k];picked[k]=false}
      await evRef(mp.eid).update({items,picked,...stamp()});
      if(mp.remember)await db.collection("gear").doc(mp.gid).set({...g,kind:"need",mapTo:alloc,...stamp()});
      closeSheet();toast(mp.remember?`已換成實際器材，下次「${g.name}」會自動換`:"已換成實際器材");
    }else{
      await db.collection("gear").doc(mp.gid).set({...g,kind:"need",mapTo:alloc,...stamp()});closeSheet();toast("已更新對應");
    }
    mp=null;
  }catch(err){setErr(errMsg(err))}
}

/* ---------- boot ---------- */
/* ---------- 備份／還原（測試版資料只在這支手機，記得偶爾備份） ---------- */
function backupSec(){return`<section class="sec"><div class="sech"><h2>資料</h2></div><div class="list">
  <button type="button" class="row" data-act="backup"><span class="rn">下載備份<small>把所有活動、器材、維修、範本存成一個檔案</small></span>${IC.chev}</button>
  <label class="row" style="position:relative;cursor:pointer"><span class="rn">從備份還原<small>會用備份檔取代這支手機上的全部資料（範本檔則只加入範本）</small></span>${IC.chev}<input type="file" id="restoreFile" accept="application/json,.json" style="position:absolute;inset:0;opacity:0"></label>
  </div></section>`}
function doBackup(){
  const blob=new Blob([JSON.stringify(LDB.dump(),null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`器材調度板備份-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
document.addEventListener("click",e=>{if(e.target.closest('[data-act="backup"]'))doBackup()});
document.addEventListener("change",async e=>{
  if(e.target.id!=="restoreFile")return;const f=e.target.files[0];e.target.value="";if(!f)return;
  let obj;try{obj=JSON.parse(await f.text())}catch(_){toast("這不是備份檔");return}
  if(obj&&obj.merge===true){await mergeFile(obj,f.name);return}
  if(obj&&isObj(obj.templates)&&!obj.gear&&!obj.events){const t=Object.entries(obj.templates).filter(([,v])=>v&&Array.isArray(v.items));if(!t.length){toast("檔案裡沒有範本");return}
    if(!confirm(`要匯入 ${t.length} 個範本（${t.map(([k])=>k).join("、")}）嗎？同名範本會被取代，其他資料不動。`))return;
    try{for(const[k,v]of t)await db.collection("templates").doc(k).set({...v,type:k,...stamp()});toast(`已匯入 ${t.length} 個範本`)}catch(_){toast("匯入失敗")}return}
  if(!obj||typeof obj!=="object"||!obj.gear||!obj.events){toast("這不是器材調度板的備份檔");return}
  if(!confirm(`要用「${f.name}」取代這支手機上的全部資料嗎？`))return;
  try{await LDB.restore(obj);toast("已還原")}catch(_){toast("還原失敗")}
});

/* 合併匯入（merge:true）：只加沒有的器材、已有的只補別名；範本同名取代。活動和維修不動。 */
async function mergeFile(obj,fname){
  const gear=Object.values(isObj(obj.gear)?obj.gear:{}).filter(g=>g&&g.name),tpl=Object.entries(isObj(obj.templates)?obj.templates:{}).filter(([,v])=>v&&Array.isArray(v.items)),tn=tpl.map(([k])=>k).filter(k=>k!=="__types");
  const plan=gear.map(g=>{const names=[g.name,...(g.aliases||[])];let id=null;for(const n of names){id=matchGear(n);if(id)break}return{g,id}});
  const nNew=plan.filter(x=>!x.id).length,nOld=plan.length-nNew;
  if(!plan.length&&!tpl.length){toast("檔案裡沒有可以匯入的東西");return}
  if(!confirm(`要從「${fname}」加入：\n新器材 ${nNew} 項${nOld?`（另有 ${nOld} 項已經有了，只補別名）`:""}${tn.length?`\n範本 ${tn.length} 個（${tn.join("、")}，同名會取代）`:""}${tpl.length>tn.length?"\n活動性質清單":""}\n\n活動、數量、維修都不會動。`))return;
  try{
    for(const{g,id}of plan){
      if(id){const cur=S.gear.get(id),have=new Set([cur.name,...(cur.aliases||[])].map(norm)),add=[g.name,...(g.aliases||[])].filter(n=>!have.has(norm(n)));
        const upd={};if(add.length)upd.aliases=[...(cur.aliases||[]),...add];if(!cur.unit&&g.unit&&UNITS.includes(g.unit))upd.unit=g.unit;
        if(Object.keys(upd).length)await db.collection("gear").doc(id).update({...upd,...stamp()})}
      else await db.collection("gear").doc().set({name:String(g.name).trim(),category:CATS.includes(g.category)?g.category:guessCat(g.name),unit:UNITS.includes(g.unit)?g.unit:"",qty:null,note:String(g.note||""),aliases:(g.aliases||[]).filter(Boolean),...stamp()});
    }
    for(const[k,v]of tpl)await db.collection("templates").doc(k).set({...v,type:k,...stamp()});
    toast(nNew||tn.length?`已加入 ${nNew} 項器材${tn.length?`、${tn.length} 個範本`:""}`:"已匯入");
  }catch(_){toast("匯入失敗")}
}
/* 跨過午夜或從背景回來時重畫，讓「已抓好」到進場日自動變演出中 */
let lastDay=todayStr();
const dayCheck=()=>{if(todayStr()!==lastDay){lastDay=todayStr();render()}};
setInterval(dayCheck,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
if("serviceWorker"in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});

render();
(async()=>{
  try{await LDB.init();db=LDB}catch(e){console.error(e);S.dbOk=false;S.canWrite=false;S.loaded={g:1,e:1,r:1};render();return}
  S.me="me";
  S.dbOk=true;
  const onErr=e=>{if(e&&e.code==="revoked"){S.dbOk=false;S.canWrite=false}render()};
  db.collection("gear").onSnapshot(s=>{S.gear=new Map(s.docs.map(x=>[x.id,x.data()]));S.loaded.g=1;refreshLists();render();if(rs)renderReturn()},onErr);
  db.collection("events").onSnapshot(s=>{S.events=new Map(s.docs.filter(x=>{const v=x.data();return validDate(v.start)&&validDate(v.end)}).map(x=>[x.id,x.data()]));S.loaded.e=1;refreshLists();render()},onErr);
  db.collection("templates").onSnapshot(s=>{S.templates=new Map(s.docs.map(x=>[x.id,x.data()]));render()},onErr);
  db.collection("repairs").onSnapshot(s=>{S.repairs=new Map(s.docs.map(x=>[x.id,x.data()]));S.loaded.r=1;render()},onErr);
})();
</script>
